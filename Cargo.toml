[package]
name = "iroh-mem-transport"
version = "0.1.2"
edition = "2024"
authors = ["Jacobus Geluk <jacobus.geluk@dataroad.com>"]
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "In-memory custom transport for iroh — endpoints in the same process connect over in-memory datagram queues as a native iroh path, so QUIC multiplexes and authenticates with no sockets, files, or network at all"
repository = "https://github.com/legra-ai/iroh-mem-transport"
homepage = "https://github.com/legra-ai/iroh-mem-transport"
keywords = ["iroh", "p2p", "transport", "in-memory", "testing"]
categories = ["network-programming"]
readme = "README.md"

[dependencies]
# The custom-transport API is gated behind iroh's `unstable-custom-transports`
# feature — experimental and may shift between iroh releases; pinned tightly.
iroh = { version = "1.0.0", features = ["unstable-custom-transports"] }
iroh-base = "1.0"
n0-watcher = "1.0"
noq-udp = "1.0"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
rhusky = "0.0.6"
